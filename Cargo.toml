[package]
name = "memroute"
version = "0.1.0"
edition = "2024"
description = "A portable local Tantivy-based knowledge router for agent workspaces"
license = "MIT OR Apache-2.0"
keywords = ["agent", "knowledge", "retrieval", "search", "tantivy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.22"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# A public remote is configured by the repository owner; enable this check once `package.repository` exists.
cargo_common_metadata = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
