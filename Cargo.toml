[package]
name = "memroute"
version = "0.1.0"
edition = "2024"
description = "A local Tantivy-based knowledge router for agent workspaces"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.22"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"
